<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teika Fusion</title>
<style>
  *  { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #12162e;
    color: #e0e8ff;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1c2245;
    border: 1px solid #2d3870;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(77,184,255,0.08);
  }
  h1 {
    font-size: 2.8rem; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #fff 40%, #4db8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: #7a8fc2; font-size: 1.05rem; margin: 12px 0 36px; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .links a {
    display: block; padding: 14px 20px;
    background: #12162e; border: 1px solid #2d3870; border-radius: 12px;
    color: #4db8ff; text-decoration: none; font-weight: 600; font-size: 0.95rem;
    transition: border-color .2s, background .2s;
  }
  .links a:hover { background: #1a2250; border-color: #4db8ff; }
  footer { margin-top: 32px; color: #3a4470; font-size: 0.8rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Teika Fusion</h1>
    <p class="sub">Fusiona · Explota · Domina</p>
    <div class="links">
      <a href="/privacy-policy">📋 Política de Privacidad</a>
      <a href="/terms">📄 Términos de Uso</a>
      <a href="/borrar-cuenta">🗑️ Eliminar cuenta y datos</a>
    </div>
  </div>
  <footer>© 2026 Teika Fusion</footer>
</body>
</html>
